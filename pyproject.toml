[project]
name = "email-assistant-obsidian"
version = "0.1.0"
description = "An implementation of a CrewAI agent acting as a personal assistant. The agent can draft emails based on the knowledge base built in Obsidian."
authors = [{ name = "ZhYoo1226" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "qdrant-client>=1.12.2",
    "fastembed>=0.4.0",
    "watchdog>=6.0.0",
    "google-api-python-client>=2.157.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "pysocks>=1.7.1",
    "markdownify>=0.14.1",
    "crewai[agentops,litellm]>=0.95.0",
    "litellm>=1.84.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep the default rules plus bug-prone patterns; the full ALL set flags too
# much stylistic churn on an existing codebase.
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# tests deliberately reach into "private" helpers; the strip-marker tests
# intentionally strip multi-char strings (B005 flags single-char-prefix strips)
"tests/*" = ["B011", "B005"]
# config.py's patch block must run after the gateway env vars are set;
# main.py must reconfigure stdout/stderr to UTF-8 before any import that prints
"config.py" = ["E402"]
"main.py" = ["E402"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/email_assistant"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
